function reqTable(list,med){
 const head=med?['Patient','Medicine requirement','Assigned','Expected delivery','Status']:['Patient','Requirement','Category','Priority','Assigned','Due','Status','Last update'];
 const row=r=>{const p=PP(r.personId),t='<td class="ttl" data-l="Requirement"><button class="lnk" data-a="openReq" data-id="'+r.id+'">'+esc(r.title)+'</button><div class="s">'+r.id+' · from '+esc(r.source)+'</div></td>',pt='<td data-l="Patient">'+esc(p.name)+(p.kind==='living'?' <span class="tag">Living</span>':'')+'</td>',as='<td data-l="Assigned">'+(r.assignee?esc(nameOf(r.assignee)):'<span class="s">Unassigned</span>')+'</td>';

 visitRec(fd){const v=S.visits.find(x=>x.id===val(fd,'id')),n=val(fd,'notes');v.status='Completed';v.notes=n;let msg='Visit completed with '+CMP(v.companionId).name+': '+n;if(val(fd,'plan')&&val(fd,'next')){S.visits.push({id:uid(),personId:v.personId,companionId:v.companionId,date:val(fd,'next'),time:val(fd,'time'),status:'Scheduled',notes:'',ask:''});msg+=' Next visit: '+when(val(fd,'next'),val(fd,'time'))+'.'}addUpdate(v.personId,msg,'visit',me());UI.modal=null;commit('Interaction recorded')},
 evNew(fd){S.events.push({id:uid(),title:val(fd,'title'),date:val(fd,'date'),time:val(fd,'time'),place:val(fd,'place'),desc:val(fd,'desc'),participants:[],attended:[],status:'Upcoming'});UI.modal=null;commit('Event created')},
 evAdd(fd){const e=S.events.find(x=>x.id===val(fd,'id')),pid=val(fd,'pid');if(pid&&!e.participants.includes(pid))e.participants.push(pid);commit('Participant registered')},
 evDone(fd){const e=S.events.find(x=>x.id===val(fd,'id'));e.attended=fd.getAll('att');e.status='Completed';e.attended.forEach(pid=>addUpdate(pid,first(PP(pid).name)+' attended '+e.title+'.','activity',me()));UI.modal=null;commit('Attendance saved')},
 apptNew(fd){const a={id:uid(),personId:val(fd,'pid'),doctorId:val(fd,'doc'),date:val(fd,'date'),time:val(fd,'time'),type:val(fd,'type'),mode:val(fd,'mode'),status:'Scheduled'};S.appts.push(a);addUpdate(a.personId,'Appointment booked with '+DOC(a.doctorId).name+' on '+when(a.date,a.time)+': '+a.type+'.','activity',me());UI.modal=null;commit('Appointment scheduled')},
 checkin(fd){const id=val(fd,'id'),pid=val(fd,'pid'),mood=val(fd,'mood'),note=val(fd,'note'),by=UI.role==='team'?UI.who.team:'s1';let k=id?S.checkins.find(x=>x.id===id):null;
  if(!k){k={id:uid(),personId:pid,date:T(),time:'',by,mode:'On site'};S.checkins.push(k)}
  Object.assign(k,{status:'Done',mood,note,doneAt:Date.now()});addUpdate(pid,'Check-in: '+first(PP(pid).name)+' is '+(mood==='Good'?'doing well':mood==='Okay'?'okay':'in need of attention')+'. '+note,'activity',me());
  if(val(fd,'raise'))createReq({personId:pid,title:short(note),desc:note,category:'Health concern',priority:'High',source:'Care Team',by:me(),famText:null});
  if(val(fd,'next')){S.checkins.push({id:uid(),personId:pid,date:D(1),time:k.time||'10:00 AM',by:k.by,mode:k.mode,status:'Scheduled',mood:'',note:'',doneAt:0})}
  UI.modal=null;commit('Check-in recorded')},
 roomAlloc(fd){PP(val(fd,'pid')).room=val(fd,'room');commit('Room allocated')},
 resStaff(fd){PP(val(fd,'id')).staffId=val(fd,'sid');commit('Caregiver assigned')},
 famPost(fd){addUpdate(val(fd,'pid'),val(fd,'text'),'notice','SATHI Living team');commit('Update sent to family')},
 maintNew(fd){S.maint.push({id:uid(),roomId:val(fd,'room'),issue:val(fd,'issue'),by:me(),date:T(),assignee:val(fd,'asg'),status:'Open'});UI.modal=null;commit('Maintenance request created')}};
document.addEventListener('click',e=>{const o=e.target.classList&&e.target.classList.contains('ov')?e.target:null;if(o){UI.modal=null;render();return}
 const el=e.target.closest('[data-a]');if(!el)return;const h=A[el.dataset.a];if(h){e.preventDefault();h(el.dataset,el)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=F[f.dataset.form];if(h)h(new FormData(f))});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const t=el.dataset.chg;
 if(t==='who'){UI.who[UI.role]=el.value;UI.sel.doctor=null;UI.updPatient=null;render()}
 else if(t==='f'){UI.f[el.dataset.k]=el.value;render()}else if(t==='livingRes'){UI.livingRes[UI.role]=el.value;render()}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(el){UI.f.q=el.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=null;render()}});
render();
})();
</script>
